<app-auth-layout>
  <div class="auth-card">
    <div class="brand">
      <app-dilg-seal [size]="52" />
      <span class="brand-name">E-BPCO</span>
    </div>

    <h1 class="title">Create Account</h1>

    <form (ngSubmit)="onSubmit(registerForm)" #registerForm="ngForm" novalidate>
      <label class="field-label" for="fullName">Full Name</label>
      <div class="input-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.6" />
          <path
            d="M4.5 20c1-3.8 4.2-6 7.5-6s6.5 2.2 7.5 6"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
        <input
          id="fullName"
          name="fullName"
          type="text"
          placeholder="Your full name"
          [(ngModel)]="fullName"
          required
          autocomplete="name"
        />
      </div>

      <label class="field-label" for="email">Enter Email Address</label>
      <div class="input-wrap" [class.invalid]="emailInvalid()">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v11A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5v-11Z"
            stroke="currentColor"
            stroke-width="1.6"
          />
          <path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="Your email here"
          [(ngModel)]="email"
          (ngModelChange)="onEmailChange()"
          required
          autocomplete="username"
        />
      </div>

      <label class="field-label" for="password">Enter Password</label>
      <div class="input-wrap" [class.invalid]="passwordMismatch()">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="5" y="10.5" width="14" height="9.5" rx="1.8" stroke="currentColor" stroke-width="1.6" />
          <path d="M8 10.5V8a4 4 0 1 1 8 0v2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <input
          id="password"
          name="password"
          [type]="showPassword() ? 'text' : 'password'"
          placeholder="Create a password"
          [(ngModel)]="password"
          (ngModelChange)="onPasswordChange()"
          required
          autocomplete="new-password"
        />
        <button
          type="button"
          class="toggle-visibility"
          (click)="togglePassword()"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        >
          @if (showPassword()) {
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M3 12s3.6-7 9-7 9 7 9 7-3.6 7-9 7-9-7-9-7Z" stroke="currentColor" stroke-width="1.6" />
              <circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.6" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M3 12s3.6-7 9-7 9 7 9 7-3.6 7-9 7-9-7-9-7Z" stroke="currentColor" stroke-width="1.6" />
              <path d="m3 3 18 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          }
        </button>
      </div>

      <label class="field-label" for="confirmPassword">Confirm Password</label>
      <div class="input-wrap" [class.invalid]="passwordMismatch()">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="5" y="10.5" width="14" height="9.5" rx="1.8" stroke="currentColor" stroke-width="1.6" />
          <path d="M8 10.5V8a4 4 0 1 1 8 0v2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          placeholder="Re-enter your password"
          [(ngModel)]="confirmPassword"
          (ngModelChange)="onPasswordChange()"
          required
          autocomplete="new-password"
        />
      </div>
      @if (registerError()) {
        <p class="field-error">{{ registerError() }}</p>
      }

      <button type="submit" class="btn-primary">Create Account</button>
    </form>

    <p class="switch-auth">
      Already Have an Account? <a routerLink="/login">Login Here</a>
    </p>
  </div>
</app-auth-layout>
