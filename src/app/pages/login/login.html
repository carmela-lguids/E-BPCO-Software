<app-auth-layout>
  <div class="auth-card">
    <div class="brand">
      <app-dilg-seal [size]="52" />
      <span class="brand-name">E-BPCO</span>
    </div>

    <h1 class="title">Admin Portal</h1>

    <form (ngSubmit)="onSubmit(loginForm)" #loginForm="ngForm" novalidate>
      <label class="field-label" for="email">Enter Email Address</label>
      <div class="input-wrap" [class.invalid]="loginError()">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v11A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5v-11Z"
            stroke="currentColor"
            stroke-width="1.6"
          />
          <path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="Your email here"
          [(ngModel)]="email"
          (ngModelChange)="onEmailChange()"
          required
          autocomplete="username"
          [attr.aria-invalid]="loginError() ? true : null"
          [attr.aria-describedby]="loginError() ? 'email-error' : null"
        />
      </div>
      @if (loginError()) {
        <p class="field-error" id="email-error">{{ loginError() }}</p>
      }

      <label class="field-label" for="password">Enter Password</label>
      <div class="input-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="5" y="10.5" width="14" height="9.5" rx="1.8" stroke="currentColor" stroke-width="1.6" />
          <path d="M8 10.5V8a4 4 0 1 1 8 0v2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <input
          id="password"
          name="password"
          [type]="showPassword() ? 'text' : 'password'"
          placeholder="Enter your password"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
        />
        <button
          type="button"
          class="toggle-visibility"
          (click)="togglePassword()"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        >
          @if (showPassword()) {
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M3 12s3.6-7 9-7 9 7 9 7-3.6 7-9 7-9-7-9-7Z"
                stroke="currentColor"
                stroke-width="1.6"
              />
              <circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.6" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M3 12s3.6-7 9-7 9 7 9 7-3.6 7-9 7-9-7-9-7Z"
                stroke="currentColor"
                stroke-width="1.6"
              />
              <path d="m3 3 18 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          }
        </button>
      </div>

      <div class="row-between">
        <label class="remember">
          <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe" />
          Remember me
        </label>
        <a class="link" href="#">Forgot your password?</a>
      </div>

      <button type="submit" class="btn-primary">Login Account</button>
    </form>

    <p class="switch-auth">
      Don't Have an Account Yet? <a routerLink="/register">New Account</a>
    </p>
    <p class="support-note">
      Need help signing in? Contact your Tenant Administrator or the Support Desk.
    </p>
  </div>
</app-auth-layout>
