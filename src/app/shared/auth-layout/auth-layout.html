<div class="auth-shell">
  <div class="auth-visual">
    <svg
      class="visual-shape"
      viewBox="0 0 100 130"
      preserveAspectRatio="none"
      aria-hidden="true"
    >
      <defs>
        <linearGradient id="redGrad" x1="0" y1="0" x2="100" y2="130" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#c81e2c" />
          <stop offset="1" stop-color="#8f0f1a" />
        </linearGradient>
        <clipPath id="blobClip">
          <path d="M0,0 H74 C86,14 76,28 80,41 C84,54 93,60 87,73 C81,86 72,92 68,100 C64,108 70,118 62,130 H0 Z" />
        </clipPath>
      </defs>

      <g clip-path="url(#blobClip)">
        <rect x="0" y="0" width="100" height="130" fill="url(#redGrad)" />

        <g fill="#5c0a11" opacity="0.55">
          <rect x="2" y="86" width="8" height="44" />
          <rect x="11" y="74" width="7" height="56" />
          <rect x="19" y="94" width="6" height="36" />
          <rect x="26" y="68" width="9" height="62" />
          <rect x="36" y="88" width="6" height="42" />
          <rect x="43" y="78" width="8" height="52" />
          <rect x="52" y="96" width="6" height="34" />
          <rect x="59" y="82" width="7" height="48" />
        </g>
        <g fill="#4a070d" opacity="0.6">
          <rect x="8" y="100" width="3" height="30" />
          <rect x="23" y="104" width="3" height="26" />
          <rect x="33" y="98" width="3" height="32" />
          <rect x="48" y="106" width="3" height="24" />
          <rect x="56" y="100" width="3" height="30" />
        </g>
      </g>
    </svg>

    <div class="visual-seal">
      <app-dilg-seal [size]="150" />
    </div>
  </div>

  <div class="auth-panel">
    <ng-content></ng-content>
  </div>
</div>
