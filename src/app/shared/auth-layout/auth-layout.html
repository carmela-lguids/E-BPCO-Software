<div class="auth-shell">
  <div class="auth-visual">
    <svg class="visual-shape" viewBox="0 0 100 130" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <clipPath id="blobClip" clipPathUnits="userSpaceOnUse">
          <path d="M0,0 H74 C86,14 76,28 80,41 C84,54 93,60 87,73 C81,86 72,92 68,100 C64,108 70,118 62,130 H0 Z" />
        </clipPath>
        <linearGradient id="redTint" x1="0" y1="0" x2="90" y2="130" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#c81e2c" />
          <stop offset="1" stop-color="#5c0a11" />
        </linearGradient>
      </defs>

      <g clip-path="url(#blobClip)">
        <image
          href="/assets/backgrounds/auth-skyline.jpg"
          x="0"
          y="0"
          width="100"
          height="130"
          preserveAspectRatio="xMidYMid slice"
          class="visual-photo-img"
        />
        <rect x="0" y="0" width="100" height="130" fill="url(#redTint)" class="visual-tint" />
      </g>
    </svg>

    <div class="visual-seal">
      <span class="seal-glow" aria-hidden="true"></span>
      <app-dilg-seal [size]="150" />
    </div>
  </div>

  <div class="auth-panel">
    <ng-content></ng-content>
  </div>
</div>
