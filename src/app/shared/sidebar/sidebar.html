@if (uiState.sidebarOpen()) {
  <div class="sidebar-backdrop" (click)="uiState.closeSidebar()"></div>
}

<aside class="sidebar" [class.open]="uiState.sidebarOpen()">
  <div class="brand">
    <app-dilg-seal [size]="36" />
    <span>E-BPCO</span>
  </div>

  <nav class="nav-list">
    @for (item of navItems(); track item.path) {
      <a
        class="nav-item"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        [title]="item.label"
        (click)="uiState.closeSidebar()"
      >
        <app-icon [name]="item.icon" [size]="19" />
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
</aside>
