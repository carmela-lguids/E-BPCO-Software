<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 200 200"
  class="seal"
  role="img"
  aria-label="DILG seal"
>
  <defs>
    <linearGradient id="phMapGrad" x1="70" y1="35" x2="140" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2823c" />
      <stop offset="1" stop-color="#f8d548" />
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="98" fill="#c81e2c" />
  <circle cx="100" cy="100" r="82" fill="none" stroke="#f5c518" stroke-width="24" />
  <circle cx="100" cy="100" r="70" fill="#ffffff" stroke="#c81e2c" stroke-width="2.5" />

  @for (node of ringNodes(); track node.x + node.y) {
    <g [attr.transform]="'translate(' + node.x + ',' + node.y + ') rotate(' + node.rotation + ')'">
      @if (node.type === 'shield') {
        <path
          d="M0,-7.5 C3.6,-7.5 5.6,-5 5.6,-1.4 C5.6,3.4 2.8,7.2 0,9 C-2.8,7.2 -5.6,3.4 -5.6,-1.4 C-5.6,-5 -3.6,-7.5 0,-7.5 Z"
          fill="#c81e2c"
        />
      } @else {
        <circle cx="0" cy="-5" r="2.7" fill="#c81e2c" />
        <path d="M-3.6,1.6 Q0,-2 3.6,1.6 L3.6,7.4 Q0,9 -3.6,7.4 Z" fill="#c81e2c" />
      }
    </g>
  }

  <g>
    <path
      d="M85,55 C80,50 78,45 82,40 C88,35 95,38 98,45 C102,42 108,44 110,50 C114,48 120,52 118,58 C122,62 120,68 115,70 C118,75 114,80 108,78 C110,84 104,88 98,84 C95,90 88,88 87,82 C82,84 78,80 80,74 C75,72 74,66 78,62 C74,58 78,54 85,55 Z"
      fill="url(#phMapGrad)"
    />
    <path
      d="M92,98 C95,96 99,97 99,101 C99,105 95,106 92,104 C89,102 89,100 92,98 Z"
      fill="url(#phMapGrad)"
    />
    <path
      d="M104,100 C107,98 111,99 111,103 C111,107 107,108 104,106 C101,104 101,102 104,100 Z"
      fill="url(#phMapGrad)"
    />
    <path
      d="M110,110 C113,108 117,110 116,114 C115,118 111,118 109,115 C107,112 108,111 110,110 Z"
      fill="url(#phMapGrad)"
    />
    <path
      d="M108,125 C104,120 106,114 112,113 C116,108 124,110 126,116 C132,114 138,119 136,125 C142,128 141,136 135,138 C138,144 132,150 126,147 C126,153 118,156 114,151 C108,153 103,148 106,142 C101,140 100,133 105,129 C103,127 105,125 108,125 Z"
      fill="url(#phMapGrad)"
    />
  </g>

  <text
    x="100"
    y="138"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="800"
    font-size="34"
    fill="#0d0d0d"
  >DILG</text>

  <path id="topArc" d="M28 100a72 72 0 0 1 144 0" fill="none" />
  <text font-family="Arial, Helvetica, sans-serif" font-size="8.6" font-weight="700" fill="#111111" letter-spacing="0.5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      DEPARTMENT OF THE INTERIOR AND LOCAL GOVERNMENT
    </textPath>
  </text>

  <path id="bottomArc" d="M32 132a68 68 0 0 0 136 0" fill="none" />
  <text font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="700" fill="#111111" letter-spacing="1">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      REPUBLIC OF THE PHILIPPINES
    </textPath>
  </text>
</svg>
