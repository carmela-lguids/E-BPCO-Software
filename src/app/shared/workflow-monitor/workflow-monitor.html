<app-topbar title="Workflow" />

<div class="workflow-head">
  <h2>System Flowchart</h2>
  <div class="head-actions">
    <button type="button" class="btn-primary" (click)="backToList()">Back to List</button>

    <div class="filter-dropdown">
      <button type="button" class="filter-toggle" (click)="toggleFilterMenu()">
        <app-icon name="filter" [size]="14" />
        {{ activeLabel() }}
      </button>

      @if (filterMenuOpen()) {
        <div class="filter-panel">
          <span class="filter-panel-title">Filter</span>
          @for (f of filters; track f.key) {
            <label class="filter-option">
              <input
                type="checkbox"
                [checked]="activeFilter() === f.key"
                (change)="selectFilter(f.key)"
              />
              {{ f.label }}
            </label>
          }
        </div>
      }
    </div>
  </div>
</div>

<section class="stage-summary" aria-label="Applications currently at each stage">
  @for (stat of stageStats; track stat.key) {
    <button
      type="button"
      class="stage-stat"
      [class.active]="activeFilter() === stat.key"
      [class.bottleneck]="isBottleneck(stat)"
      (click)="selectFilter(stat.key)"
    >
      <span class="stage-stat-top">
        <span class="stage-stat-label">{{ stat.label }}</span>
        @if (isBottleneck(stat)) {
          <span class="bottleneck-flag" title="Average dwell time exceeds the target for this stage">Bottleneck</span>
        }
      </span>
      <span class="stage-stat-count">{{ stat.count }}</span>
      <span class="stage-stat-meta">{{ stat.avgDwellDays }}d avg &middot; target {{ stat.targetDays }}d &middot; oldest {{ stat.oldestDays }}d</span>
    </button>
  }
</section>

<section class="card canvas-card">
  <app-flow-chart
    [title]="activeFlow().title"
    [nodes]="activeFlow().nodes"
    [edges]="activeFlow().edges"
    [viewBoxWidth]="activeFlow().width"
    [viewBoxHeight]="activeFlow().height"
  />
</section>
