@if (impersonating(); as imp) {
  <div class="imp-banner" role="status">
    <app-icon name="eye" [size]="16" />
    <span>
      You are viewing the <strong>Municipality of {{ imp.tenant }}</strong> as
      <strong>{{ account().roleLabel }}</strong>.
    </span>
    <button type="button" class="end-btn" (click)="end()">End Impersonation</button>
  </div>
}
